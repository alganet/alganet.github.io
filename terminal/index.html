<!doctype html>
<html lang="en">

<meta charset="utf-8">
<!-- alganet.dev — the shell version.

     This page is a thin terminal host. The site itself is index.sh, a pure-shell
     TUI (tui.sh) running on busybox ash compiled to wasm via wasi-sh, painting to
     an xterm.js canvas. The blog content is the .tui files generated alongside the
     HTML by ../build.sh, mounted read-only at /content. xterm.js is only a screen,
     a keyboard, and — via the web-links addon — clickable URLs.

     Interactive sessions need cross-origin isolation for SharedArrayBuffer. It now
     arrives on the response: a Cloudflare Transform Rule sets COOP/COEP on
     /terminal/* (see README, "The domain"). GitHub Pages cannot send headers, so
     before the domain moved to Cloudflare this was done entirely by the service
     worker below. -->
<!-- coi-serviceworker is now the FALLBACK, not the mechanism. When the edge headers
     are honoured it sees crossOriginIsolated and returns without registering — no
     worker, no reload. It still earns its place on browsers where `credentialless`
     does NOT yield isolation (Safari, mainly): there it registers, detects the
     failure, and reloads once with require-corp, which a static header cannot do.
     That degrade path is why deleting this file is not a no-op.

     credentialless is the preferred mode because it keeps the wasm/SAB path working
     while still allowing cross-origin subresources that send no CORP (Google
     Analytics) to load; the require-corp degrade trades those away to stay isolated.
     Scope is /terminal/ only, so the plain HTML site at / is untouched. -->
<script>window.coi = { coepCredentialless: () => true };</script>
<script src="./coi-serviceworker.js"></script>
<!-- Google Analytics — same property as the HTML site (script.js); skip locally. -->

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>alganet · blog — in your terminal</title>
<link rel="stylesheet" href="./dist/xterm.css">
<style>
  :root { --bg:#171b20; }  /* match index.sh's C_BG so the terminal padding is seamless */
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:ui-monospace,monospace;color:#c9d1d9}
  #term{position:fixed;inset:0;padding:10px}
  .xterm{height:100%}
  /* Boot splash — a calm centered line until the shell paints its first frame. */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:var(--bg);color:#78c47e;
    font:15px/1.5 ui-monospace,monospace;transition:opacity .5s ease;z-index:5}
  #boot .mark{font-size:24px;letter-spacing:.02em;color:#eef2f8;font-weight:600}
  #boot .mark b{color:#78c47e;font-weight:600}
  #boot .sub{color:#5a6473;letter-spacing:.02em}
  #boot .bar{width:180px;height:2px;background:#1c2230;overflow:hidden;border-radius:2px}
  #boot .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#78c47e,#76aaec);
    animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  #boot.gone{opacity:0;pointer-events:none}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.05) 2px 3px),
      radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,.28) 100%);
    mix-blend-mode:multiply}
</style>
</head>
<body>
<div id="term"></div>
<div id="fx"></div>
<div id="boot">
  <div class="mark"><b>alganet.dev</b></div>
  <div class="bar"><i></i></div>
  <div class="sub">booting the shell version in your browser…</div>
</div>
<script type="module" src="./dist/app.js"></script>
</body>
</html>
