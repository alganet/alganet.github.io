version: 2
updates:
  # terminal/'s browser dependencies (xterm.js + wasi-sh). Everything else on
  # the site is generated by build.sh in POSIX shell and has no dependencies at
  # all — tuish is vendored by vendor.sh because the name `tuish` on npm
  # belongs to an unrelated project.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the routine bumps. Majors stay out of the group and get
      # their own PR: xterm majors have moved APIs before, and the last one is
      # why addon-canvas had to be dropped.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
